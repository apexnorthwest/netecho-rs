---
name: Main Branch Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/Containerfile'
      - '**/.github/workflows/main-branch-build.yaml'
      - '**/src/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'

permissions:
  contents: read

jobs: 
  docker-build:
    permissions:
      packages: write
      security-events: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Only
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          provenance: false
          tags: ghcr.io/apexnorthwest/netecho-rs:dev-${{ matrix.arch }}
          file: Containerfile

      - name: Run Trivy vulnerability scanner
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/apexnorthwest/netecho-rs:dev-${{ matrix.arch }}'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-results.sarif

  combine-manifests:
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine Manifests
        run: |
          echo "Assembling multi-arch manifest for ghcr.io/apexnorthwest/netecho-rs:dev"
          docker manifest create ghcr.io/apexnorthwest/netecho-rs:dev ghcr.io/apexnorthwest/netecho-rs:dev-amd64 ghcr.io/apexnorthwest/netecho-rs:dev-arm64
          echo "Pushing multi-arch manifest for ghcr.io/apexnorthwest/netecho-rs:dev"
          docker manifest push ghcr.io/apexnorthwest/netecho-rs:dev